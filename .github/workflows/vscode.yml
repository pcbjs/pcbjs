name: VS Code acceptance

on:
  pull_request:
  push:
    branches: [main, beta2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-headless:
    name: Installed extension, Linux virtual display
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the candidate VSIX
        run: npm run package -w @pcbjs/vscode
      - name: Install virtual desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth openbox dbus-x11 libnss3 libgbm1 libgtk-3-0t64 libasound2t64
      - name: Download stable VS Code from Microsoft
        run: |
          mkdir -p "$RUNNER_TEMP/pcbjs-vscode"
          curl --fail --location --retry 3 https://update.code.visualstudio.com/latest/linux-x64/stable -o "$RUNNER_TEMP/pcbjs-vscode.tar.gz"
          tar -xzf "$RUNNER_TEMP/pcbjs-vscode.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/pcbjs-vscode"
      - name: Full installed-host acceptance without computer use
        run: |
          mkdir -p "$RUNNER_TEMP/pcbjs-vscode-report"
          "$RUNNER_TEMP/pcbjs-vscode/bin/code" --version > "$RUNNER_TEMP/pcbjs-vscode-report/code-version.txt"
          npm run test:vscode:headless -- --code "$RUNNER_TEMP/pcbjs-vscode/code" --repo "$GITHUB_WORKSPACE" --vsix "$GITHUB_WORKSPACE/packages/cli/vscode/vscode-pcbjs.vsix" --out "$RUNNER_TEMP/pcbjs-vscode-report"
      - name: Preserve reports, screenshots and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-installed-linux-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcbjs-vscode-report/
          if-no-files-found: warn
          retention-days: 14
