name: CI

on:
  pull_request:
  push:
    branches: [main, beta2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# one model cache for every example and test, kept by actions/cache
env:
  PCBJS_CACHE_DIR: ${{ github.workspace }}/.pcbjs-cache

jobs:
  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - name: Every import of a pcbjs package names an entry it lists
        run: node scripts/check-entries.mjs

  test:
    name: Correctness, ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: board output
            workspaces: -w @pcbjs/core -w @pcbjs/compile -w @pcbjs/export -w @pcbjs/fab -w @pcbjs/kicad -w @pcbjs/lib -w @pcbjs/step
          - suite: session and language server
            workspaces: -w @pcbjs/cli -w @pcbjs/lsp -w @pcbjs/ts-plugin -w @pcbjs/skills
          - suite: user interactions
            workspaces: -w @pcbjs/pcbjs -w @pcbjs/ui -w @pcbjs/viewer -w @pcbjs/vscode -w pcbjs-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ${{ env.PCBJS_CACHE_DIR }}
          key: model-cache-${{ hashFiles('examples/**/models/LICENSES.md') }}
      - name: Prepare models and libraries
        run: node scripts/check-examples.mjs --fetch
      - if: matrix.suite == 'user interactions'
        run: npm run build -w @pcbjs/vscode
      - run: npm test ${{ matrix.workspaces }}

  compatibility:
    name: Compatibility, ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build -w @pcbjs/vscode
      - name: Paths, live updates, source mapping and editor lifecycle
        run: >-
          node --import ./scripts/test-env.mjs --import ./scripts/test-watchdog.mjs
          --test --test-concurrency=1
          packages/cli/tests/file-paths.test.mjs
          packages/cli/tests/session-paths.test.mjs
          packages/cli/tests/session-models.test.mjs
          packages/cli/tests/typecheck.test.mjs
          packages/lsp/tests/documents.test.mjs
          packages/vscode/tests/reveal.test.mjs
          packages/vscode/tests/lifecycle.test.mjs
          packages/pcbjs/tests/edit-path-library-backtrace.test.mjs

  boards:
    name: Example boards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The user model cache, vendor and fetched models and their meshes
        uses: actions/cache@v4
        with:
          path: ${{ env.PCBJS_CACHE_DIR }}
          key: model-cache-${{ hashFiles('examples/**/models/LICENSES.md') }}
      - name: Check every example, cold
        run: node scripts/check-examples.mjs
      - name: Representative board outputs agree cold, warm and after cache recovery
        run: node scripts/stage-equality.mjs demo highspeed
      - name: Build the demo boards
        run: npm run demo:build
      - name: Every demo fab set is orderable
        run: |
          files=$(find examples/demo/.pcbjs/fab -name README-fab.txt)
          test -n "$files"
          for f in $files; do grep -q 'STATUS: ORDERABLE' "$f" || { echo "$f is not orderable"; exit 1; }; done

  browser:
    name: Browser compile, Chromium against Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: The demo boards and highspeed compiled in Chromium equal Node's, board JSON, finding ids and lengths
        run: node scripts/browser-equality.mjs
        env:
          PCBJS_CHROME: ${{ steps.chrome.outputs.chrome-path }}

  pack:
    name: Pack and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle the VS Code extension into @pcbjs/cli
        run: npm run package -w @pcbjs/vscode
      - name: Pack smoke test
        run: node scripts/pack-smoke.mjs
