# Builds the whole site into one Pages artifact, since every deploy replaces the site: main at / for https://pcbjs.dev, the latest published train at /stable/.
# Runs on pushes to main that touch the site's sources, and from release.yml after a publish; it needs no secret, only Pages set to GitHub Actions, see RELEASING.md.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - site/**
      - examples/**
      - README.md
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the main and stable trees
    if: github.repository == 'pcbjs/pcbjs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PCBJS_SITE_URL: https://pcbjs.dev
      OUT: ${{ github.workspace }}/_site
      STABLE: ${{ github.workspace }}/_stable
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - id: stable
        name: The latest published train
        run: |
          tag=$(git -c versionsort.suffix=- tag --list '@pcbjs/pcbjs@*' --sort=-v:refname | head -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Stable tree from ${tag:-main, no train is published yet}"
      # taken before anything writes into examples/
      - id: hash
        name: Content hashes of the gallery
        run: |
          echo "packages=${{ hashFiles('packages/*/src/**', 'packages/*/package.json', 'site/scripts/**') }}" >> "$GITHUB_OUTPUT"
          echo "examples=${{ hashFiles('examples/**') }}" >> "$GITHUB_OUTPUT"
      # a published train never changes, so its built tree is kept by tag
      - id: tree
        name: Built stable tree of the train
        if: steps.stable.outputs.tag != ''
        uses: actions/cache/restore@v4
        with:
          path: _stable
          key: stable-site-2-${{ steps.stable.outputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # boards.mjs recompiles a project whose folder or packages changed, so any older gallery is a safe start
      - id: gallery
        name: Gallery and route caches of main
        uses: actions/cache/restore@v4
        with:
          path: |
            site/.gallery
            examples/*/.pcbjs/routes
            examples/*/*/.pcbjs/routes
            examples/*/.pcbjs/models
            examples/*/*/.pcbjs/models
          key: gallery-${{ steps.hash.outputs.packages }}-${{ steps.hash.outputs.examples }}
          restore-keys: |
            gallery-${{ steps.hash.outputs.packages }}-
            gallery-
      - run: npm ci
      - run: npm run build
      - id: main
        name: Main tree at /
        run: npm run build -w pcbjs-site -- --outDir "$OUT"
      - name: Save the gallery of main
        if: ${{ !cancelled() && steps.main.outcome == 'success' && steps.gallery.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            site/.gallery
            examples/*/.pcbjs/routes
            examples/*/*/.pcbjs/routes
            examples/*/.pcbjs/models
            examples/*/*/.pcbjs/models
          key: gallery-${{ steps.hash.outputs.packages }}-${{ steps.hash.outputs.examples }}
      - name: Check out the train
        if: steps.stable.outputs.tag != '' && steps.tree.outputs.cache-hit != 'true'
        run: git worktree add "$RUNNER_TEMP/stable" "${{ steps.stable.outputs.tag }}"
      # the train's own boards.mjs may not hash the packages, so main's gallery goes over only when nothing it depends on differs
      - name: Gallery of main into the train
        if: steps.stable.outputs.tag != '' && steps.tree.outputs.cache-hit != 'true'
        env:
          TAG: ${{ steps.stable.outputs.tag }}
        run: |
          if ! git diff --quiet "$TAG" HEAD -- packages examples site/scripts; then
            echo "The train differs from main, so it compiles its own gallery"
            exit 0
          fi
          for d in site/.gallery examples/*/.pcbjs/routes examples/*/*/.pcbjs/routes; do
            [ -d "$d" ] || continue
            mkdir -p "$RUNNER_TEMP/stable/$(dirname "$d")"
            cp -R "$d" "$RUNNER_TEMP/stable/$(dirname "$d")/"
          done
      - id: train
        name: Stable tree from the train
        if: steps.stable.outputs.tag != '' && steps.tree.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/stable
        run: |
          npm ci
          npm run build
          npm run build -w pcbjs-site -- --outDir "$STABLE"
        env:
          PCBJS_SITE_BASE: /stable/
      - name: Save the stable tree of the train
        if: ${{ !cancelled() && steps.train.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: _stable
          key: stable-site-2-${{ steps.stable.outputs.tag }}
      - name: Stable tree at /stable/, the old /next/ redirected, domain and no Jekyll
        run: |
          if [ -d "$STABLE" ]; then mkdir -p "$OUT/stable" && cp -R "$STABLE/." "$OUT/stable/"; fi
          mkdir -p "$OUT/next"
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=/"><link rel="canonical" href="https://pcbjs.dev/">' > "$OUT/next/index.html"
          echo pcbjs.dev > "$OUT/CNAME"
          touch "$OUT/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
