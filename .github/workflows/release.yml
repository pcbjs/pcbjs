name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Version and validate the train, including installed tarballs, without pushing or publishing
        type: boolean
        default: false
      resume_version:
        description: Recover this exact version commit or release tag; extension registries are not republished
        type: string
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version, publish and tag a train
    if: github.repository == 'pcbjs/pcbjs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      RESUME_VERSION: ${{ inputs.resume_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Bot identity for git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: train
        name: Select the new train or the explicitly requested recovery
        run: node scripts/release-state.mjs
      - name: Check out the recovery's version commit
        if: steps.train.outputs.mode == 'resume'
        run: git checkout --detach "$TRAIN_REF"
        env:
          TRAIN_REF: ${{ steps.train.outputs.ref }}
      # no npm cache and no registry-url: npm authenticates through OIDC, never a token
      - name: npm with trusted publishing
        run: npm install -g npm@11.21.1
      - run: npm ci
      - name: Version the train
        if: steps.train.outputs.mode == 'new'
        run: |
          npx changeset version
          # the example templates of pcbjs create pin the versions the bump just wrote
          node packages/cli/scripts/sync-examples.mjs
          npm install --package-lock-only
          git add -A
          git commit -q -m "pcbjs $(node -p "require('./packages/pcbjs/package.json').version")"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Bundle the VS Code extension into @pcbjs/cli
        run: npm run package -w @pcbjs/vscode
      - name: Fetch the vendor models and install the libraries the tests read
        run: node scripts/check-examples.mjs --fetch
      - run: npm test
      - name: Check every example, cold
        run: node scripts/check-examples.mjs
      - name: Every example agrees cold, warm and through cache recovery
        run: node scripts/stage-equality.mjs
      - name: Build the demo fab sets
        run: npm run demo:build
      - name: Every demo fab set is orderable
        run: |
          files=$(find examples/demo/.pcbjs/fab -name README-fab.txt)
          test -n "$files"
          for f in $files; do grep -q 'STATUS: ORDERABLE' "$f" || { echo "$f is not orderable"; exit 1; }; done
      - name: Install and exercise the versioned tarballs
        run: node scripts/pack-smoke.mjs
      - name: Validation left the version commit unchanged
        run: git diff --exit-code
      - name: Dry run, the validated train that would ship
        if: env.DRY_RUN == 'true'
        run: |
          git log -1 --format=%s
          git show --stat --oneline HEAD
          for p in packages/*/package.json; do node -p "const p = require('./$p'); p.name + ' ' + p.version"; done
          echo "Release notes:"
          node scripts/release-notes.mjs
      - name: Push the version commit to main
        if: env.DRY_RUN != 'true' && steps.train.outputs.mode == 'new'
        # a rejection means main moved since the checkout: rerun the workflow
        run: git push origin HEAD:main
      - id: vscode
        name: Did this train move the extension
        if: env.DRY_RUN != 'true' && steps.train.outputs.mode == 'new'
        run: |
          now=$(node -p "require('./packages/vscode/package.json').version")
          was=$(git show HEAD^:packages/vscode/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8') || '{}').version")
          echo "changed=$([ "$now" != "$was" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish missing npm packages
        if: env.DRY_RUN != 'true' && steps.train.outputs.publish == 'true'
        run: npx changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true
      - name: Push the tags
        if: env.DRY_RUN != 'true' && steps.train.outputs.publish == 'true'
        run: |
          version=$(node -p "require('./packages/pcbjs/package.json').version")
          tag="@pcbjs/pcbjs@$version"
          # A retry can find every npm version published but no train tag pushed.
          git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null || git tag "$tag"
          git push origin --tags
      - id: vsix
        name: The packaged VSIX
        if: env.DRY_RUN != 'true'
        run: |
          m=packages/cli/vscode/manifest.json
          echo "path=packages/cli/vscode/$(node -p "require('./$m').file")" >> "$GITHUB_OUTPUT"
          echo "pre=$(node -p "require('./$m').preRelease ? '--pre-release' : ''")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./$m').version")" >> "$GITHUB_OUTPUT"
      - id: tokens
        name: Which extension registries have a token
        if: steps.vscode.outputs.changed == 'true'
        run: |
          echo "vsce=$([ -n "$VSCE_PAT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ovsx=$([ -n "$OVSX_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      - name: Visual Studio Marketplace
        if: steps.tokens.outputs.vsce == 'true'
        run: npx --yes @vscode/vsce@3 publish ${{ steps.vsix.outputs.pre }} --packagePath "${{ steps.vsix.outputs.path }}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Visual Studio Marketplace, no token
        if: steps.tokens.outputs.vsce == 'false'
        run: echo "::notice title=VS Code extension::VSCE_PAT is not set, so ${{ steps.vsix.outputs.version }} was not published to the Visual Studio Marketplace"
      - name: Open VSX
        if: steps.tokens.outputs.ovsx == 'true'
        continue-on-error: true
        run: npx --yes ovsx@0 publish "${{ steps.vsix.outputs.path }}" -p "$OVSX_TOKEN"
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      - name: Open VSX, no token
        if: steps.tokens.outputs.ovsx == 'false'
        run: echo "::notice title=VS Code extension::OVSX_TOKEN is not set, so ${{ steps.vsix.outputs.version }} was not published to Open VSX"
      - name: Extension registries on recovery
        if: env.DRY_RUN != 'true' && steps.train.outputs.mode == 'resume'
        run: echo "::notice title=VS Code extension::Recovery skips registry publication. Check each registry for this exact extension version and retry only a missing version as described in RELEASING.md."
      - name: GitHub Release of the train
        if: env.DRY_RUN != 'true'
        run: |
          version=$(node -p "require('./packages/pcbjs/package.json').version")
          tag="@pcbjs/pcbjs@$version"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            node scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"
            case "$version" in *-*) pre=--prerelease ;; *) pre= ;; esac
            gh release create "$tag" --title "pcbjs $version" $pre --notes-file "$RUNNER_TEMP/notes.md"
          fi
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for asset in "$VSIX" packages/cli/vscode/manifest.json; do
            if ! printf '%s\n' "$assets" | grep -Fxq "$(basename "$asset")"; then gh release upload "$tag" "$asset"; fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSIX: ${{ steps.vsix.outputs.path }}
      - name: Refresh the stable site
        if: env.DRY_RUN != 'true'
        # a push by GITHUB_TOKEN starts no workflow, but a workflow_dispatch through the API does
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
