name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Version the pending changesets and print the result, without pushing or publishing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version, publish and tag a train
    if: github.repository == 'pcbjs/pcbjs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Bot identity for git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: pending
        name: Pending changesets
        run: |
          if [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md -print -quit)" ]; then
            echo "resume=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p "require('./packages/pcbjs/package.json').version")
          if [ "$DRY_RUN" != "true" ] && [ -z "$(git tag -l "@pcbjs/pcbjs@$version")" ]; then
            echo "::notice title=Release::No pending changesets, but $version on main is untagged, so this run publishes it"
            echo "resume=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error title=Release::No pending changeset in .changeset, nothing to release. Add one with npm run changeset and commit it to main first."
          exit 1
      # no npm cache and no registry-url: npm authenticates through OIDC, never a token
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Version the train
        if: steps.pending.outputs.resume == 'false'
        run: |
          npx changeset version
          npm install --package-lock-only
          git add -A
          git commit -q -m "pcbjs $(node -p "require('./packages/pcbjs/package.json').version")"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dry run, the train that would ship
        if: env.DRY_RUN == 'true'
        run: |
          git log -1 --format=%s
          git diff --stat HEAD^ HEAD
          for p in packages/*/package.json; do node -p "const p = require('./$p'); p.name + ' ' + p.version"; done
          echo "Release notes:"
          node scripts/release-notes.mjs
      - name: Push the version commit to main
        if: env.DRY_RUN != 'true' && steps.pending.outputs.resume == 'false'
        # a rejection means main moved since the checkout: rerun the workflow
        run: git push origin HEAD:main
      - id: vscode
        name: Did this train move the extension
        if: env.DRY_RUN != 'true'
        run: |
          now=$(node -p "require('./packages/vscode/package.json').version")
          was=$(git show HEAD^:packages/vscode/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8') || '{}').version")
          echo "changed=$([ "$now" != "$was" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: env.DRY_RUN != 'true'
        run: npm run build
      - name: Bundle the VS Code extension into @pcbjs/cli
        if: env.DRY_RUN != 'true'
        run: npm run package -w @pcbjs/vscode
      - name: npm with trusted publishing
        if: env.DRY_RUN != 'true'
        run: npm install -g npm@11.21.1
      - name: Publish under the beta dist-tag
        if: env.DRY_RUN != 'true'
        run: npx changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true
      - name: Push the tags
        if: env.DRY_RUN != 'true'
        run: git push origin --tags
      - id: vsix
        name: The packaged VSIX
        if: env.DRY_RUN != 'true'
        run: |
          m=packages/cli/vscode/manifest.json
          echo "path=packages/cli/vscode/$(node -p "require('./$m').file")" >> "$GITHUB_OUTPUT"
          echo "pre=$(node -p "require('./$m').preRelease ? '--pre-release' : ''")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./$m').version")" >> "$GITHUB_OUTPUT"
      - id: tokens
        name: Which extension registries have a token
        if: steps.vscode.outputs.changed == 'true'
        run: |
          echo "vsce=$([ -n "$VSCE_PAT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ovsx=$([ -n "$OVSX_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      - name: Visual Studio Marketplace
        if: steps.tokens.outputs.vsce == 'true'
        run: npx --yes @vscode/vsce@3 publish ${{ steps.vsix.outputs.pre }} --packagePath "${{ steps.vsix.outputs.path }}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Visual Studio Marketplace, no token
        if: steps.tokens.outputs.vsce == 'false'
        run: echo "::notice title=VS Code extension::VSCE_PAT is not set, so ${{ steps.vsix.outputs.version }} was not published to the Visual Studio Marketplace"
      - name: Open VSX
        if: steps.tokens.outputs.ovsx == 'true'
        continue-on-error: true
        run: npx --yes ovsx@0 publish "${{ steps.vsix.outputs.path }}" -p "$OVSX_TOKEN"
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      - name: Open VSX, no token
        if: steps.tokens.outputs.ovsx == 'false'
        run: echo "::notice title=VS Code extension::OVSX_TOKEN is not set, so ${{ steps.vsix.outputs.version }} was not published to Open VSX"
      - name: GitHub Release of the train
        if: env.DRY_RUN != 'true'
        run: |
          version=$(node -p "require('./packages/pcbjs/package.json').version")
          tag="@pcbjs/pcbjs@$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice title=GitHub Release::$tag already has a release"
            exit 0
          fi
          node scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"
          case "$version" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$tag" --title "pcbjs $version" $pre --notes-file "$RUNNER_TEMP/notes.md" \
            "${{ steps.vsix.outputs.path }}" packages/cli/vscode/manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh the stable site
        if: env.DRY_RUN != 'true'
        # a push by GITHUB_TOKEN starts no workflow, but a workflow_dispatch through the API does
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
